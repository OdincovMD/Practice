services:
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "${NGINX_HOST_PORT:-90}:80"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/pneumonia}
      - ML_UPLOAD_URL=${ML_UPLOAD_URL:-http://ml:9000/upload}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      ml:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: ${HEALTHCHECK_INTERVAL:-15}s
      timeout: ${HEALTHCHECK_TIMEOUT:-5}s
      retries: ${HEALTHCHECK_RETRIES:-5}
      start_period: 25s

  ml:
    build:
      context: ./ml
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=5)",
        ]
      interval: ${HEALTHCHECK_INTERVAL:-20}s
      timeout: ${HEALTHCHECK_TIMEOUT:-5}s
      retries: ${HEALTHCHECK_RETRIES:-5}
      start_period: ${ML_START_PERIOD:-120}s

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-pneumonia}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
